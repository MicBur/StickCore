name: Windows Installer & Release

# Baut StickCore auf Windows, sammelt alle Schriften & Abhängigkeiten,
# baut den Inno Setup Installer (StickCoreSetup.exe), packt ein Portable-ZIP
# und veröffentlicht das Release automatisch auf GitHub.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Qt 6 installieren
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: 'qtimageformats'

      - name: OpenCV installieren (Foto-KI)
        shell: cmd
        run: choco install opencv -y --no-progress

      - name: Konfigurieren & bauen
        shell: cmd
        run: |
          for /d %%d in ("C:\tools\opencv\build") do set OCVDIR=%%d
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DOpenCV_DIR=C:\tools\opencv\build
          cmake --build build --config Release

      - name: Qt-Abhängigkeiten & Schriften sammeln (windeployqt)
        shell: cmd
        run: |
          mkdir deploy
          copy build\Release\StickCore.exe deploy\
          windeployqt --release --no-translations --no-system-d3d-compiler deploy\StickCore.exe
          mkdir deploy\fonts
          copy assets\fonts\*.ttf deploy\fonts\
          copy media\fonts\*.ttf deploy\fonts\
          copy media\stickcore.ico deploy\
          copy media\stickcore_logo.png deploy\

      - name: OpenCV-DLL beilegen
        shell: cmd
        run: |
          copy C:\tools\opencv\build\x64\vc16\bin\opencv_world*.dll deploy\
          dir deploy

      - name: Inno Setup installieren
        shell: cmd
        run: choco install innosetup -y --no-progress

      - name: Installer bauen
        shell: cmd
        run: |
          mkdir Output
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\StickCore.iss

      - name: Portable-ZIP schnüren
        shell: pwsh
        run: |
          Compress-Archive -Path deploy\* -DestinationPath Output\StickCore-Portable-v1.0.0.zip -Force

      - name: Installer & ZIP als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: StickCore-Windows-Build
          path: Output/*
          if-no-files-found: error

      - name: GitHub Release veröffentlichen
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Output/StickCoreSetup.exe
            Output/StickCore-Portable-v1.0.0.zip
          generate_release_notes: true
